<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>📖 小说阅读器</title>
<style>
  :root {
    --bg: #f5f0e8;
    --text: #3a3226;
    --text-secondary: #8b7e6a;
    --accent: #b8753e;
    --accent-light: #d4956a;
    --card-bg: #fdfaf5;
    --border: #e0d5c1;
    --shadow: 0 2px 16px rgba(60, 40, 20, 0.08);
    --sidebar-bg: #ede4d5;
    --hover-bg: #f0e8d8;
    --active-bg: #e4d4b8;
    --font-serif: 'Georgia', 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', 'STSong', serif;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  [data-theme="dark"] {
    --bg: #1a1a1a;
    --text: #d4cfc4;
    --text-secondary: #8a8578;
    --accent: #c8956c;
    --accent-light: #d4a882;
    --card-bg: #242424;
    --border: #3a3530;
    --shadow: 0 2px 16px rgba(0, 0, 0, 0.3);
    --sidebar-bg: #1e1e1e;
    --hover-bg: #2a2a2a;
    --active-bg: #333028;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
    transition: background var(--transition), color var(--transition);
  }

  /* ========== Sidebar ========== */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: transform var(--transition), background var(--transition);
    z-index: 10;
  }
  .sidebar.hidden { transform: translateX(-280px); min-width: 0; width: 0; pointer-events: none; }

  .sidebar-header {
    padding: 20px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .sidebar-header .logo { font-size: 1.4em; }
  .sidebar-header h1 { font-size: 1.1em; font-weight: 600; white-space: nowrap; }

  .book-info {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    font-size: 0.85em;
    color: var(--text-secondary);
    line-height: 1.6;
  }
  .book-info .title { font-size: 1em; color: var(--text); font-weight: 600; margin-bottom: 4px; }
  .book-info .meta { display: flex; gap: 12px; flex-wrap: wrap; }

  /* ===== Sidebar Tabs ===== */
  .sidebar-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-tabs button {
    flex: 1;
    padding: 10px 0;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 0.85em;
    cursor: pointer;
    font-family: var(--font-sans);
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .sidebar-tabs button:hover { color: var(--text); }
  .sidebar-tabs button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }

  /* ===== Shelf ===== */
  .shelf { display: none; flex: 1; overflow-y: auto; padding: 4px 0; }
  .shelf.visible { display: block; }
  .shelf::-webkit-scrollbar { width: 4px; }
  .shelf::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .shelf-item {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    text-align: left;
    padding: 8px 12px;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 0.83em;
    cursor: pointer;
    transition: background 0.12s;
    font-family: var(--font-sans);
    line-height: 1.4;
    border-left: 3px solid transparent;
    border-radius: 0;
  }
  .shelf-item:hover { background: var(--hover-bg); }
  .shelf-item.current {
    background: var(--active-bg);
    border-left-color: var(--accent);
    font-weight: 600;
  }
  .shelf-item .shelf-info { flex: 1; min-width: 0; }
  .shelf-item .shelf-name {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .shelf-item .shelf-meta {
    font-size: 0.8em; color: var(--text-secondary); margin-top: 2px;
  }

  /* ===== Delete Confirm Modal ===== */
  .delete-backdrop {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); z-index: 50;
    justify-content: center; align-items: center;
    opacity: 0; transition: opacity 0.2s;
  }
  .delete-backdrop.visible { display: flex; opacity: 1; }

  .delete-dialog {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 24px 28px 20px;
    min-width: 280px; max-width: 90vw;
    text-align: center;
    box-shadow: 0 8px 40px rgba(0,0,0,0.25);
    transition: background var(--transition);
  }
  .delete-dialog .dd-title {
    font-size: 0.95em; color: var(--text-secondary); margin-bottom: 4px;
  }
  .delete-dialog .dd-name {
    font-size: 1.05em; font-weight: 600; color: var(--text);
    margin-bottom: 18px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 260px;
  }
  .delete-dialog .dd-btn {
    display: inline-block;
    background: #e53e3e; color: #fff;
    border: none; border-radius: 24px;
    padding: 12px 40px;
    font-size: 1em; font-weight: 700;
    cursor: pointer;
    min-width: 160px;
    transition: all 0.15s;
    font-family: var(--font-sans);
  }
  .delete-dialog .dd-btn:active { background: #c53030; transform: scale(0.96); }
  .delete-dialog .dd-cancel {
    display: block; margin-top: 12px;
    background: none; border: none;
    color: var(--text-secondary); font-size: 0.85em;
    cursor: pointer; font-family: var(--font-sans);
    padding: 6px 16px;
  }
  .delete-dialog .dd-cancel:hover { color: var(--text); }

  .shelf-empty { padding: 24px 16px; text-align: center; color: var(--text-secondary); font-size: 0.85em; }

  /* ===== Sidebar Backdrop (mobile) ===== */
  .sidebar-backdrop {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4); z-index: 11;
    opacity: 0; transition: opacity 0.25s;
  }
  .sidebar-backdrop.visible { display: block; opacity: 1; }

  /* ===== Sidebar Close Button (mobile) ===== */
  .sidebar-close-btn {
    display: none;
    background: none; border: none;
    font-size: 1.5em; color: var(--text-secondary); cursor: pointer;
    padding: 0 4px; line-height: 1;
  }
  .sidebar-close-btn:hover { color: var(--text); }

  .toc {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .toc::-webkit-scrollbar { width: 4px; }
  .toc::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .toc-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 16px;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 0.88em;
    cursor: pointer;
    transition: background 0.15s;
    font-family: var(--font-sans);
    line-height: 1.4;
    border-left: 3px solid transparent;
  }
  .toc-item:hover { background: var(--hover-bg); }
  .toc-item.active {
    background: var(--active-bg);
    border-left-color: var(--accent);
    font-weight: 600;
  }
  .toc-item .chapter-num {
    display: inline-block;
    color: var(--accent);
    margin-right: 6px;
    font-size: 0.8em;
    min-width: 24px;
  }

  /* ========== Main ========== */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--card-bg);
    flex-wrap: wrap;
    transition: background var(--transition);
  }

  .toolbar button, .toolbar .btn-file {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    font-size: 0.83em;
    font-family: var(--font-sans);
    transition: all 0.15s;
    white-space: nowrap;
  }
  .toolbar button:hover, .toolbar .btn-file:hover {
    background: var(--hover-bg);
    border-color: var(--accent);
  }
  .toolbar button.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .toolbar .spacer { flex: 1; }

  .toolbar .font-size-group {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .toolbar .font-size-label {
    font-size: 0.8em;
    color: var(--text-secondary);
    min-width: 36px;
    text-align: center;
  }

  .toolbar .progress-text {
    font-size: 0.8em;
    color: var(--text-secondary);
    margin: 0 8px;
  }

  /* ========== Reader Area ========== */
  .reader-container {
    flex: 1;
    overflow-y: auto;
    display: flex;
    justify-content: center;
    padding: 40px 20px 80px;
  }
  .reader-container::-webkit-scrollbar { width: 6px; }
  .reader-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

  .reader {
    --reader-width: 720px;
    max-width: var(--reader-width);
    width: 100%;
    font-family: var(--font-serif);
    line-height: 1.9;
    font-size: 18px;
    text-align: justify;
    word-break: break-word;
    transition: max-width 0.25s ease;
  }

  .reader h2 {
    font-size: 1.6em;
    text-align: center;
    margin: 30px 0 10px;
    color: var(--accent);
    font-weight: 700;
  }
  .reader h3 {
    font-size: 1.2em;
    text-align: center;
    margin: 20px 0 8px;
    font-weight: 600;
    color: var(--text);
  }
  .reader p {
    text-indent: 2em;
    margin: 0.4em 0;
  }
  .reader .chapter-title {
    font-size: 1.6em;
    font-weight: 700;
    text-align: center;
    margin: 40px 0 30px;
    color: var(--accent);
    line-height: 1.4;
  }

  /* ===== Chapter Navigation ===== */
  .chapter-nav {
    display: flex; justify-content: space-between; gap: 12px;
    margin: 40px 0 20px; padding: 16px 0;
    border-top: 1px solid var(--border);
    user-select: none;
  }
  .chapter-nav button {
    flex: 1; padding: 12px 16px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg); color: var(--text);
    font-size: 0.95em; cursor: pointer;
    font-family: var(--font-sans);
    transition: all 0.15s;
  }
  .chapter-nav button:hover { border-color: var(--accent); color: var(--accent); }
  .chapter-nav button:active { background: var(--hover-bg); }
  .chapter-nav button:disabled { opacity: 0.35; cursor: default; border-color: var(--border); color: var(--text-secondary); }
  .chapter-nav button:disabled:hover { border-color: var(--border); color: var(--text-secondary); }

  /* ===== Floating Bottom Nav (mobile) ===== */
  .bottom-nav {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card-bg); border-top: 1px solid var(--border);
    padding: 8px 12px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    z-index: 15; gap: 8px;
    justify-content: space-between;
    transition: opacity 0.25s, transform 0.25s;
    box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
    opacity: 0; transform: translateY(100%);
    pointer-events: none;
  }
  .bottom-nav.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .bottom-nav button {
    flex: 1; padding: 10px 8px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text);
    font-size: 0.85em; cursor: pointer;
    font-family: var(--font-sans);
  }
  .bottom-nav button:active { background: var(--hover-bg); }
  .bottom-nav button:disabled { opacity: 0.3; }

  /* ========== Welcome / Empty State ========== */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    color: var(--text-secondary);
    user-select: none;
  }
  .welcome .icon { font-size: 80px; margin-bottom: 20px; opacity: 0.6; }
  .welcome h2 { font-size: 1.5em; color: var(--text); margin-bottom: 8px; }
  .welcome p { font-size: 0.95em; margin: 4px 0; }
  .welcome .drop-zone {
    margin-top: 30px;
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 50px 60px;
    transition: all 0.3s;
    cursor: pointer;
  }
  .welcome .drop-zone:hover, .welcome .drop-zone.drag-over {
    border-color: var(--accent);
    background: var(--hover-bg);
  }
  .welcome .drop-zone .dz-icon { font-size: 48px; }
  .welcome .drop-zone .dz-text { margin-top: 10px; font-size: 0.9em; }

  /* ========== Loading / Progress ========== */
  .progress-bar-container {
    width: 100%;
    height: 3px;
    background: var(--border);
    position: relative;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s;
    border-radius: 0 2px 2px 0;
  }

  /* ========== Toast ========== */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #333;
    color: #fff;
    padding: 10px 24px;
    border-radius: 20px;
    font-size: 0.9em;
    opacity: 0;
    transition: all 0.3s;
    z-index: 100;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ========== @media (tablet) ========== */
  @media (max-width: 768px) {
    .sidebar {
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 20;
      width: 75vw; min-width: 75vw;
      box-shadow: 4px 0 24px rgba(0,0,0,0.15);
    }
    .sidebar.hidden { transform: translateX(-75vw); min-width: 75vw; width: 75vw; pointer-events: none; }
    .sidebar-backdrop.visible { display: block; opacity: 1; }
    .sidebar-close-btn { display: inline-block; }
    .reader { font-size: 16px; }
    .reader-container { padding: 20px 4px 100px; }
    .toolbar { gap: 2px; padding: 6px 8px; }
    .toolbar button { padding: 6px 8px; font-size: 0.76em; }
  }

  /* ========== @media (phone, <480px) ========== */
  @media (max-width: 480px) {
    .sidebar { width: 72vw; min-width: 72vw; border-right: none; }
    .sidebar.hidden { transform: translateX(-72vw); min-width: 72vw; width: 72vw; pointer-events: none; }
    .sidebar-header { padding: 14px 12px; }
    .sidebar-header h1 { font-size: 1em; }
    .sidebar-close-btn { display: inline-block; }
    .book-info { padding: 12px; font-size: 0.8em; }
    .sidebar-tabs button { padding: 10px 0; font-size: 0.82em; }
    .shelf-item { padding: 10px 12px; font-size: 0.82em; }
    .shelf-item .shelf-del { opacity: 0.6; padding: 8px 12px; font-size: 1.1em; }
    .toc-item { padding: 11px 12px; font-size: 0.85em; }

    .toolbar { gap: 2px; padding: 5px 6px; justify-content: space-between; flex-wrap: nowrap; }
    .toolbar button, .toolbar .btn-file { padding: 7px 7px; font-size: 0.7em; border-radius: 6px; gap: 2px; }
    .toolbar .spacer { display: none; }
    .toolbar .progress-text { display: none; }
    .toolbar .font-size-label { min-width: 28px; font-size: 0.7em; }
    .toolbar .font-size-group { gap: 1px; }
    .toolbar .font-size-group button { padding: 7px 6px; }

    .reader-container { padding: 16px 0 100px; }
    .reader { max-width: 88vw; width: 88vw; font-size: 17px; line-height: 2.0; text-align: justify; padding: 0 2px; }
    .reader h2 { font-size: 1.3em; margin: 24px 0 8px; }
    .reader h3 { font-size: 1.05em; margin: 16px 0 6px; }
    .reader p { text-indent: 1.8em; margin: 0.3em 0; }
    .reader .chapter-title { font-size: 1.35em; margin: 32px 0 24px; }

    .progress-bar-container { height: 2px; }

    .welcome .icon { font-size: 56px; }
    .welcome h2 { font-size: 1.2em; }
    .welcome p { font-size: 0.85em; }
    .welcome .drop-zone { padding: 32px 24px; margin-top: 20px; }
    .welcome .drop-zone .dz-icon { font-size: 36px; }
    .welcome .drop-zone .dz-text { font-size: 0.82em; }

    .toast { bottom: 100px; font-size: 0.82em; padding: 8px 18px; }

    .bottom-nav { display: flex; }
    .reader-container { padding-bottom: 20px; }
  }

  /* ========== @media (small phone, <380px) ========== */
  @media (max-width: 380px) {
    .sidebar { width: 78vw; min-width: 78vw; }
    .sidebar.hidden { transform: translateX(-78vw); min-width: 78vw; width: 78vw; pointer-events: none; }
    .toolbar button, .toolbar .btn-file { padding: 6px 5px; font-size: 0.65em; }
    .reader { font-size: 16px; line-height: 1.95; width: 92vw; max-width: 92vw; }
    .reader-container { padding: 12px 0 90px; }
  }
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="logo">📖</span>
    <h1>小说阅读器</h1>
    <button class="sidebar-close-btn" onclick="closeSidebar()" title="关闭">✕</button>
  </div>
  <div class="book-info" id="bookInfo">
    <div class="title">未打开书籍</div>
    <div class="meta">
      <span id="bookMeta">点击下方按钮打开 .txt 文件</span>
    </div>
  </div>
  <div class="sidebar-tabs">
    <button id="tabShelf" class="active" onclick="switchTab('shelf')">📚 书架</button>
    <button id="tabToc" onclick="switchTab('toc')">📑 目录</button>
  </div>
  <div class="shelf visible" id="shelf">
    <div class="shelf-empty" id="shelfEmpty">暂无书籍，点击 📂 打开 导入</div>
  </div>
  <div class="toc" id="toc" style="display:none;"></div>
</aside>

<!-- Backdrop overlay for mobile sidebar -->
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

<!-- Delete confirm modal -->
<div class="delete-backdrop" id="deleteBackdrop" onclick="cancelDelete()">
  <div class="delete-dialog" onclick="event.stopPropagation()">
    <div class="dd-title">确认删除这本书吗？</div>
    <div class="dd-name" id="deleteBookName"></div>
    <button class="dd-btn" id="deleteBtn" onmousedown="startDeleteCountdown()" ontouchstart="startDeleteCountdown()">长按此处 3 秒</button>
    <button class="dd-cancel" onclick="cancelDelete()">取消</button>
  </div>
</div>

<!-- Main -->
<div class="main">
  <div class="toolbar" id="toolbar">
    <button onclick="toggleSidebar()" title="目录">📋 目录</button>
    <label class="btn-file">
      📂 打开
      <input type="file" accept=".txt" id="fileInput" hidden onchange="handleFile(this.files[0])">
    </label>
    <span class="spacer"></span>
    <div class="font-size-group">
      <button onclick="changeFontSize(-1)" title="缩小字体">A-</button>
      <span class="font-size-label" id="fontSizeLabel">18px</span>
      <button onclick="changeFontSize(1)" title="放大字体">A+</button>
    </div>
    <button id="btnTheme" onclick="toggleTheme()" title="切换主题">🌙</button>
    <span class="progress-text" id="progressText"></span>
  </div>
  <div class="progress-bar-container">
    <div class="progress-bar-fill" id="progressBar" style="width: 0%"></div>
  </div>

  <div class="reader-container" id="readerContainer">
    <div class="welcome" id="welcome">
      <div class="icon">📚</div>
      <h2>欢迎使用小说阅读器</h2>
      <p>支持 .txt 文件，自动识别章节</p>
      <p>记住阅读进度，下次打开自动恢复</p>
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div class="dz-icon">📁</div>
        <div class="dz-text">点击选择文件，或拖拽 .txt 文件到此处</div>
      </div>
    </div>
    <div class="reader" id="reader" style="display:none;"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Floating bottom navigation (mobile) -->
<div class="bottom-nav" id="bottomNav">
  <button onclick="prevChapter()" id="bnPrev">◀ 上一章</button>
  <button onclick="nextChapter()" id="bnNext">下一章 ▶</button>
</div>

<script>
// ============ State ============
let currentBook = null;
let chapters = [];
let currentChapter = 0;
let fontSize = parseInt(localStorage.getItem('reader_fontSize') || '18');
let theme = localStorage.getItem('reader_theme') || 'light';
let currentFilePath = null;

const $ = (sel) => document.querySelector(sel);
const reader = $('#reader');
const welcome = $('#welcome');
const tocEl = $('#toc');
const bookInfo = $('#bookInfo');
const progressBar = $('#progressBar');
const progressText = $('#progressText');
const fontSizeLabel = $('#fontSizeLabel');
const btnTheme = $('#btnTheme');
const readerContainer = $('#readerContainer');
const fileInput = $('#fileInput');

// ============ IndexedDB ============
var hasDB = !!window.indexedDB;
const DB_NAME = 'NovelReaderDB';
const DB_VERSION = 1;
function openDB() {
  if (!hasDB) return Promise.reject(new Error('no DB'));
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains('books')) {
        req.result.createObjectStore('books', { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbSave(id, content, chapter) {
  // Always save progress pointer first (lightweight, never fails)
  localStorage.setItem('reader_lastBook', JSON.stringify({ id, chapter, time: Date.now() }));

  // Try IndexedDB for full content
  if (hasDB) {
    try {
      var db = await openDB();
      var tx = db.transaction('books', 'readwrite');
      tx.objectStore('books').put({ id: id, content: content, chapter: chapter, time: Date.now() });
      await new Promise(function(r) { tx.oncomplete = r; tx.onerror = r; });
      db.close();
      return;
    } catch (e) {
      console.warn('IndexedDB save failed, falling back to localStorage:', e);
      hasDB = false;
    }
  }

  // Fallback: localStorage (truncates long books but saves progress + prefix)
  try {
    var maxLen = 400000;
    var truncated = content.length > maxLen ? content.substring(0, maxLen) : content;
    localStorage.setItem('reader_book_' + id, JSON.stringify({
      content: truncated,
      chapter: chapter,
      time: Date.now(),
      truncated: content.length > maxLen
    }));
  } catch (e) {
    console.warn('localStorage save also failed:', e);
  }
}
async function dbLoad(id) {
  // Try IndexedDB first
  if (hasDB) {
    try {
      var db = await openDB();
      var tx = db.transaction('books', 'readonly');
      var result = await new Promise(function(r) {
        var req = tx.objectStore('books').get(id);
        req.onsuccess = function() { r(req.result); };
        req.onerror = function() { r(null); };
      });
      db.close();
      if (result && result.content) return result;
    } catch (e) { /* fall through to localStorage */ }
  }

  // Try localStorage fallback
  try {
    var d = JSON.parse(localStorage.getItem('reader_book_' + id) || 'null');
    if (d && d.content) return d;
  } catch (e) {}

  return null;
}
async function dbListAll() {
  if (!hasDB) {
    var keys = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf('reader_book_') === 0) {
          try {
            var d = JSON.parse(localStorage.getItem(k));
            keys.push({ id: k.replace('reader_book_', ''), chapter: d.chapter || 0, time: d.time || 0 });
          } catch(e) {}
        }
      }
    } catch(e) {}
    return keys;
  }
  try {
    const db = await openDB();
    const tx = db.transaction('books', 'readonly');
    const result = await new Promise(r => {
      const req = tx.objectStore('books').getAll();
      req.onsuccess = () => r(req.result);
      req.onerror = () => r([]);
    });
    db.close();
    return result;
  } catch (e) { return []; }
}
async function dbDelete(id) {
  if (!hasDB) { localStorage.removeItem('reader_book_' + id); return; }
  try {
    const db = await openDB();
    const tx = db.transaction('books', 'readwrite');
    tx.objectStore('books').delete(id);
    await new Promise(r => { tx.oncomplete = r; tx.onerror = r; });
    db.close();
    localStorage.removeItem('reader_book_' + id);
  } catch (e) {}
}

// ============ Init ============
async function init() {
  document.documentElement.setAttribute('data-theme', theme);
  btnTheme.textContent = theme === 'dark' ? '☀️' : '🌙';

  var isMobile = window.innerWidth <= 480;
  if (isMobile && !localStorage.getItem('reader_fontSize')) { fontSize = 17; }

  reader.style.fontSize = fontSize + 'px';
  fontSizeLabel.textContent = fontSize + 'px';

  // Render shelf
  await renderShelf();

  // Restore last book from IndexedDB
  const pointer = JSON.parse(localStorage.getItem('reader_lastBook') || 'null');
  if (pointer && pointer.id) {
    const saved = await dbLoad(pointer.id);
    if (saved && saved.content) {
      currentFilePath = pointer.id;
      currentBook = saved.content;
      const restoreChapter = saved.chapter || 0;
      renderBook();
      jumpToChapter(restoreChapter, false);
      updateProgress();
      showToast('📖 已恢复上次阅读：' + pointer.id);
    } else {
      currentFilePath = pointer.id;
      bookInfo.innerHTML =
        '<div class="title">' + escapeHtml(pointer.id) + '</div>' +
        '<div class="meta"><span>上次读到第 ' + ((pointer.chapter || 0) + 1) + ' 章 — 请重新导入文件恢复内容</span></div>';
    }
  }
}

// ============ File Handling ============
fileInput.addEventListener('change', (e) => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});

function handleFile(file) {
  if (!file) return;
  const path = file.webkitRelativePath || file.name;
  // Ensure multiple select works
  if (fileInput.files.length > 1) { file = fileInput.files[fileInput.files.length - 1]; }
  const reader = new FileReader();
  reader.onload = async function(e) {
    const buf = new Uint8Array(e.target.result);
    const content = await detectAndDecode(buf);
    if (content.length > 100_000_000) {
      showToast('文件过大（最大 100MB），请先分割文件');
      return;
    }
    currentFilePath = path;
    currentBook = content;
    renderBook();
    saveState();
    await renderShelf();
    showToast('✅ 已加载：' + file.name + '  (' + detectEncoding(buf) + ')');
  };
  reader.readAsArrayBuffer(file);
}

// ============ Encoding Detection ============
function detectEncodingFromBuf(buf) {
  if (buf.length >= 3 && buf[0] === 0xEF && buf[1] === 0xBB && buf[2] === 0xBF) return 'utf-8';
  if (buf.length >= 2 && buf[0] === 0xFF && buf[1] === 0xFE) return 'utf-16le';
  if (buf.length >= 2 && buf[0] === 0xFE && buf[1] === 0xFF) return 'utf-16be';
  if (isValidUTF8(buf)) return 'utf-8';
  return 'gbk';
}

// Use Blob+FileReader for GBK decoding (more compatible than TextDecoder)
function decodeBlob(buf, encoding) {
  return new Promise(function(resolve) {
    // Strip BOM
    var start = 0;
    if (buf.length >= 3 && buf[0] === 0xEF && buf[1] === 0xBB && buf[2] === 0xBF) start = 3;
    else if (buf.length >= 2 && buf[0] === 0xFF && buf[1] === 0xFE) start = 2;
    else if (buf.length >= 2 && buf[0] === 0xFE && buf[1] === 0xFF) start = 2;

    var slice = buf.slice(start);
    var blob = new Blob([slice], { type: 'text/plain;charset=' + encoding });
    var reader = new FileReader();
    reader.onload = function() { resolve(reader.result); };
    reader.onerror = function() {
      // Fallback: try without charset
      var r2 = new FileReader();
      r2.onload = function() { resolve(r2.result); };
      r2.readAsText(new Blob([slice]));
    };
    reader.readAsText(blob);
  });
}

function detectEncoding(buf) {
  return detectEncodingFromBuf(buf).toUpperCase();
}

async function detectAndDecode(buf) {
  var enc = detectEncodingFromBuf(buf);
  // Try TextDecoder first (modern browsers)
  if (typeof TextDecoder !== 'undefined') {
    try {
      return new TextDecoder(enc).decode(buf);
    } catch(e) {}
    // Try alternate encoding names
    var aliases = (enc === 'gbk') ? ['gb18030', 'gb2312', 'chinese'] : [enc];
    for (var i = 0; i < aliases.length; i++) {
      try {
        return new TextDecoder(aliases[i]).decode(buf);
      } catch(e) {}
    }
  }
  // Fallback: use Blob + FileReader (works in older browsers too)
  return await decodeBlob(buf, enc);
}

function isValidUTF8(buf) {
  let i = 0;
  const len = buf.length;
  // Sample up to 64KB for performance
  const sampleEnd = Math.min(len, 65536);
  while (i < sampleEnd) {
    const b = buf[i];
    if (b < 0x80) { i++; continue; }
    if (b >= 0xC2 && b <= 0xDF) {
      if (i + 1 >= sampleEnd) return true;
      if ((buf[i + 1] & 0xC0) !== 0x80) return false;
      i += 2;
      continue;
    }
    if (b >= 0xE0 && b <= 0xEF) {
      if (i + 2 >= sampleEnd) return true;
      if ((buf[i + 1] & 0xC0) !== 0x80) return false;
      if ((buf[i + 2] & 0xC0) !== 0x80) return false;
      // Check overlong
      if (b === 0xE0 && (buf[i + 1] & 0xE0) === 0x80) return false;
      if (b === 0xED && (buf[i + 1] & 0xE0) === 0xA0) return false;
      i += 3;
      continue;
    }
    if (b >= 0xF0 && b <= 0xF4) {
      if (i + 3 >= sampleEnd) return true;
      if ((buf[i + 1] & 0xC0) !== 0x80) return false;
      if ((buf[i + 2] & 0xC0) !== 0x80) return false;
      if ((buf[i + 3] & 0xC0) !== 0x80) return false;
      if (b === 0xF0 && (buf[i + 1] & 0xF0) === 0x80) return false;
      if (b === 0xF4 && buf[i + 1] > 0x8F) return false;
      i += 4;
      continue;
    }
    return false; // Invalid lead byte
  }
  return true;
}

// ============ Chapter Detection ============
function detectChapters(text) {
  // Multiple patterns for chapter detection
  const patterns = [
    /(?:第[零一二三四五六七八九十百千万0-9]+[章节回卷部篇集])\s*.+/g,
    /(?:Chapter|CH|Ch)\s*\d+/gi,
    /(?:[Cc][Hh][Aa][Pp][Tt][Ee][Rr]\s*[IVXLCDM0-9]+)/g,
    /^\s*(?:第[0-9零一二三四五六七八九十百千]+[章节回])\s*.+/gm,
    /^\s*(?:[0-9]+[\.、．]\s*.+)/gm,
  ];

  let matches = [];
  for (const pat of patterns) {
    const found = [...text.matchAll(new RegExp(pat.source, 'gm'))];
    for (const m of found) {
      if (m.index !== undefined) {
        matches.push({ title: m[0].trim(), index: m.index });
      }
    }
  }

  // Deduplicate by index
  matches.sort((a, b) => a.index - b.index);
  const deduped = [];
  for (const m of matches) {
    if (deduped.length === 0 || m.index - deduped[deduped.length - 1].index > 10) {
      deduped.push(m);
    }
  }

  return deduped;
}

// ============ Render ============
var lastLoadedChapter = -1;
var nextChapterLoading = false;

function formatChapterContent(idx) {
  if (idx < 0 || idx >= chapters.length) return '';
  var start = chapters[idx].index;
  var end = idx + 1 < chapters.length ? chapters[idx + 1].index : currentBook.length;
  var content = currentBook.slice(start, end).trim();
  var lines = content.split(/\r?\n/);
  var html = '<div class="chapter-block" data-ch="' + idx + '">';
  var isFirstLine = true;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) { html += '<br>'; isFirstLine = false; continue; }
    if (isFirstLine && chapters.length > 1) {
      html += '<div class="chapter-title">' + escapeHtml(line) + '</div>';
    } else if (line.match(/^(第[零一二三四五六七八九十百千万0-9]+[章节回卷部篇集])/)) {
      html += '<h2>' + escapeHtml(line) + '</h2>';
    } else if (line.match(/^[（(][一二三四五六七八九十]+[)）]/)) {
      html += '<h3>' + escapeHtml(line) + '</h3>';
    } else {
      html += '<p>' + escapeHtml(line) + '</p>';
    }
    isFirstLine = false;
  }
  html += '</div>';
  return html;
}

function renderBook() {
  if (!currentBook) return;
  welcome.style.display = 'none';
  reader.style.display = '';
  chapters = detectChapters(currentBook);
  var fileName = currentFilePath || '未知文件';
  var totalChars = currentBook.replace(/\s/g, '').length;
  var wordCount = totalChars > 10000 ? (totalChars / 10000).toFixed(1) + '万字' : totalChars + '字';
  bookInfo.innerHTML = '<div class="title">' + escapeHtml(fileName) + '</div>' +
    '<div class="meta"><span>📊 ' + wordCount + '</span><span>📑 ' + chapters.length + ' 章</span></div>';
  tocEl.innerHTML = '';
  if (chapters.length === 0) chapters = [{ title: '全文', index: 0 }];
  chapters.forEach(function(ch, i) {
    var btn = document.createElement('button');
    btn.className = 'toc-item';
    btn.innerHTML = '<span class="chapter-num">' + (i + 1).toString().padStart(2, '0') + '</span>' + escapeHtml(ch.title);
    btn.onclick = function() { jumpToChapter(i); };
    tocEl.appendChild(btn);
  });
  // Start from saved chapter or chapter 1
  renderChapter(currentChapter);
}

function renderChapter(idx) {
  if (idx < 0 || idx >= chapters.length) return;
  currentChapter = idx;
  lastLoadedChapter = idx;
  reader.innerHTML = formatChapterContent(idx);
  readerContainer.scrollTop = 0;
  tocEl.querySelectorAll('.toc-item').forEach(function(el, i) { el.classList.toggle('active', i === idx); });
  updateProgress();
  saveState();
}

function appendNextChapter() {
  if (nextChapterLoading) return;
  var next = lastLoadedChapter + 1;
  if (next >= chapters.length) {
    // All chapters loaded
    return;
  }
  nextChapterLoading = true;
  var html = formatChapterContent(next);
  reader.innerHTML += html;
  lastLoadedChapter = next;
  // Update current chapter if we scrolled past the boundary
  // Wait a tick to let DOM settle
  setTimeout(function() { nextChapterLoading = false; }, 100);
}

function jumpToChapter(idx, save) {
  if (save === undefined) save = true;
  currentChapter = idx;
  lastLoadedChapter = idx;
  reader.innerHTML = formatChapterContent(idx);
  readerContainer.scrollTop = 0;
  tocEl.querySelectorAll('.toc-item').forEach(function(el, i) { el.classList.toggle('active', i === idx); });
  updateProgress();
  if (save) saveState();
  if (window.innerWidth <= 768) closeSidebar();
}

// Scroll detection: auto-append next chapter, update current chapter
var scrollTimer = null;
readerContainer.addEventListener('scroll', function() {
  if (!currentBook || chapters.length === 0) return;

  // Detect which chapter is currently visible
  var blocks = reader.querySelectorAll('.chapter-block');
  var containerTop = readerContainer.scrollTop;
  for (var i = 0; i < blocks.length; i++) {
    var rect = blocks[i].getBoundingClientRect();
    // Chapter is in view if its top is within the top half of the viewport
    if (rect.top < readerContainer.clientHeight * 0.5 && rect.bottom > 0) {
      var chIdx = parseInt(blocks[i].getAttribute('data-ch'), 10);
      if (!isNaN(chIdx) && chIdx !== currentChapter) {
        currentChapter = chIdx;
        tocEl.querySelectorAll('.toc-item').forEach(function(el, j) { el.classList.toggle('active', j === chIdx); });
        saveState();
      }
      break;
    }
  }

  updateProgress();

  // Auto-append next chapter when near bottom (within 300px)
  var distFromBottom = readerContainer.scrollHeight - readerContainer.scrollTop - readerContainer.clientHeight;
  if (distFromBottom < 300) {
    appendNextChapter();
  }
}, { passive: true });

function showBottomNav() {}
function hideBottomNav() {}

// ============ Progress ============
function updateProgress() {
  if (!currentBook || chapters.length === 0) return;

  // Estimate reading progress based on character position
  const start = chapters[currentChapter].index;
  const end = currentChapter + 1 < chapters.length
    ? chapters[currentChapter + 1].index
    : currentBook.length;
  const chapterProgress = readerContainer.scrollTop / (readerContainer.scrollHeight - readerContainer.clientHeight) || 0;

  const overallStart = chapters[currentChapter].index / currentBook.length;
  const overallEnd = end / currentBook.length;
  const overall = overallStart + chapterProgress * (overallEnd - overallStart);

  const pct = Math.min(100, Math.round(overall * 100));
  progressBar.style.width = pct + '%';
  progressText.textContent = pct + '%';
}

readerContainer.addEventListener('scroll', updateProgress);

// ============ Persistence ============
function saveState() {
  if (!currentBook || !currentFilePath) return;
  dbSave(currentFilePath, currentBook, currentChapter);
}

// ============ Theme ============
function toggleTheme() {
  theme = theme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  btnTheme.textContent = theme === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('reader_theme', theme);
}

// ============ Font Size ============
function changeFontSize(delta) {
  fontSize = Math.max(12, Math.min(32, fontSize + delta));
  reader.style.fontSize = fontSize + 'px';
  fontSizeLabel.textContent = fontSize + 'px';
  localStorage.setItem('reader_fontSize', fontSize);
}

// ============ Sidebar ============
function toggleSidebar() {
  var sidebar = $('#sidebar');
  var backdrop = $('#sidebarBackdrop');
  var isHidden = sidebar.classList.contains('hidden');
  if (isHidden) {
    sidebar.classList.remove('hidden');
    backdrop.classList.add('visible');
  } else {
    closeSidebar();
  }
}
function closeSidebar() {
  var sidebar = $('#sidebar');
  var backdrop = $('#sidebarBackdrop');
  sidebar.classList.add('hidden');
  backdrop.classList.remove('visible');
}
// Swipe-right to open, swipe-left to close sidebar
(function() {
  var touchStartX = 0, touchStartY = 0;
  document.addEventListener('touchstart', function(e) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', function(e) {
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 60) {
      if (dx > 0 && touchStartX < 40 && window.innerWidth <= 768) {
        toggleSidebar(); // swipe right from left edge = open
      } else if (dx < 0 && window.innerWidth <= 768) {
        closeSidebar(); // swipe left anywhere = close
      }
    }
  }, { passive: true });
})();

// ============ Shelf & Tabs ============
function switchTab(tab) {
  const tabShelf = $('#tabShelf');
  const tabToc = $('#tabToc');
  const shelf = $('#shelf');
  const toc = $('#toc');
  if (tab === 'shelf') {
    tabShelf.classList.add('active');
    tabToc.classList.remove('active');
    shelf.classList.add('visible');
    shelf.style.display = '';
    toc.style.display = 'none';
  } else {
    tabToc.classList.add('active');
    tabShelf.classList.remove('active');
    shelf.classList.remove('visible');
    shelf.style.display = 'none';
    toc.style.display = '';
  }
}

async function renderShelf() {
  const shelf = $('#shelf');
  const books = await dbListAll();
  // Sort by last read time, most recent first
  books.sort((a, b) => (b.time || 0) - (a.time || 0));

  shelf.innerHTML = '';
  if (books.length === 0) {
    shelf.innerHTML = '<div class="shelf-empty">暂无书籍<br>拖拽 .txt 或点击 📂 打开</div>';
    return;
  }

  books.forEach(function(b) {
    var div = document.createElement('div');
    div.className = 'shelf-item' + (b.id === currentFilePath ? ' current' : '');
    var totalChars = (b.content || '').replace(/\s/g, '').length;
    var wordCount = totalChars > 10000 ? (totalChars / 10000).toFixed(1) + '万字' : totalChars + '字';
    var chapterInfo = b.chapter != null ? '读到第' + (b.chapter + 1) + '章' : '';
    div.innerHTML =
      '<span class="shelf-info">' +
        '<div class="shelf-name">' + escapeHtml(b.id) + '</div>' +
        '<div class="shelf-meta">📊 ' + wordCount + (chapterInfo ? ' · 📍 ' + chapterInfo : '') + '</div>' +
      '</span>';

    var bookId = b.id;
    var pressTimer = null;

    function onPressStart() {
      pressTimer = setTimeout(function() {
        // Long-press triggered: show delete modal
        div.style.background = 'rgba(128,128,128,0.15)';
        showDeleteModal(bookId);
      }, 600);
    }

    function onPressEnd() {
      clearTimeout(pressTimer);
      pressTimer = null;
    }

    div.onclick = function() { switchBook(bookId); };

    div.addEventListener('touchstart', onPressStart, { passive: true });
    div.addEventListener('touchend', onPressEnd);
    div.addEventListener('touchmove', onPressEnd);
    div.addEventListener('touchcancel', onPressEnd);
    div.addEventListener('mousedown', function(e) { if (e.button === 0) onPressStart(); });
    div.addEventListener('mouseup', onPressEnd);
    div.addEventListener('mouseleave', onPressEnd);

    shelf.appendChild(div);
  });
}

// Store the shelf item currently being deleted so we can reset its style
var pendingDeleteId = null;
var pendingDeleteTimer = null;

function showDeleteModal(id) {
  pendingDeleteId = id;
  document.getElementById('deleteBookName').textContent = id;
  document.getElementById('deleteBtn').textContent = '长按此处 3 秒';
  document.getElementById('deleteBackdrop').classList.add('visible');
}

function startDeleteCountdown() {
  if (!pendingDeleteId) return;
  var btn = document.getElementById('deleteBtn');
  var countdown = 3;
  btn.textContent = '删除 ' + countdown;
  btn.style.background = '#e53e3e';
  pendingDeleteTimer = setInterval(function() {
    countdown--;
    if (countdown <= 0) {
      clearInterval(pendingDeleteTimer);
      pendingDeleteTimer = null;
      cancelDelete();
      deleteBook(pendingDeleteId);
      pendingDeleteId = null;
    } else {
      btn.textContent = '删除 ' + countdown;
    }
  }, 1000);
}

function cancelDelete() {
  if (pendingDeleteTimer) {
    clearInterval(pendingDeleteTimer);
    pendingDeleteTimer = null;
  }
  document.getElementById('deleteBackdrop').classList.remove('visible');
  // Reset shelf item gray
  if (pendingDeleteId) {
    var items = document.querySelectorAll('.shelf-item');
    for (var i = 0; i < items.length; i++) {
      items[i].style.background = '';
    }
  }
  pendingDeleteId = null;
}

function cancelDeleteBtnHandlers() {
  // Stop countdown on touchend/mouseup
  if (pendingDeleteTimer) {
    clearInterval(pendingDeleteTimer);
    pendingDeleteTimer = null;
    document.getElementById('deleteBtn').textContent = '长按此处 3 秒';
    showToast('继续按住完成删除');
  }
}
document.addEventListener('DOMContentLoaded', function() {
  var btn = document.getElementById('deleteBtn');
  if (btn) {
    btn.addEventListener('touchend', cancelDeleteBtnHandlers);
    btn.addEventListener('mouseup', cancelDeleteBtnHandlers);
    btn.addEventListener('mouseleave', cancelDeleteBtnHandlers);
  }
});


async function switchBook(id) {
  if (id === currentFilePath && currentBook) return; // already reading this book
  const saved = await dbLoad(id);
  if (!saved || !saved.content) {
    showToast('⚠️ 书籍内容已丢失，请重新导入');
    return;
  }
  currentFilePath = id;
  currentBook = saved.content;
  currentChapter = saved.chapter || 0;
  renderBook();
  jumpToChapter(currentChapter, false);
  updateProgress();
  await renderShelf();
  showToast('📖 已切换：' + id);
}

async function deleteBook(id) {
  await dbDelete(id);
  if (id === currentFilePath) {
    // Currently reading this book — clear the reader
    currentBook = null;
    currentFilePath = null;
    chapters = [];
    currentChapter = 0;
    reader.style.display = 'none';
    reader.innerHTML = '';
    welcome.style.display = '';
    bookInfo.innerHTML = '<div class="title">未打开书籍</div><div class="meta"><span>点击下方按钮打开 .txt 文件</span></div>';
    progressBar.style.width = '0%';
    progressText.textContent = '';
    tocEl.innerHTML = '';
    localStorage.removeItem('reader_lastBook');
  }
  await renderShelf();
  showToast('🗑️ 已移除：' + id);
}

// ============ Keyboard Shortcuts ============
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  switch (e.key) {
    case 'ArrowLeft':
      if (currentChapter > 0) jumpToChapter(currentChapter - 1);
      break;
    case 'ArrowRight':
      if (currentChapter < chapters.length - 1) jumpToChapter(currentChapter + 1);
      break;
    case 't':
      if (e.ctrlKey || e.metaKey) { e.preventDefault(); toggleTheme(); }
      break;
    case '=':
      if (e.ctrlKey || e.metaKey) { e.preventDefault(); changeFontSize(1); }
      break;
    case '-':
      if (e.ctrlKey || e.metaKey) { e.preventDefault(); changeFontSize(-1); }
      break;
    case 'b':
      if (e.ctrlKey || e.metaKey) { e.preventDefault(); toggleSidebar(); }
      break;
  }
});

// ============ Drag & Drop ============
const dropZone = $('#dropZone');
document.addEventListener('dragover', (e) => { e.preventDefault(); });
document.addEventListener('drop', (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && (file.name.endsWith('.txt') || file.type === 'text/plain')) {
    handleFile(file);
  } else {
    showToast('⚠️ 请拖入 .txt 文件');
  }
});

// Highlight drop zone
document.addEventListener('dragenter', (e) => {
  if (e.target === dropZone || dropZone.contains(e.target)) {
    dropZone.classList.add('drag-over');
  }
});
document.addEventListener('dragleave', (e) => {
  if (e.target === dropZone || dropZone.contains(e.target)) {
    dropZone.classList.remove('drag-over');
  }
});

// ============ Toast ============
let toastTimer;
function showToast(msg) {
  const toast = $('#toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

// ============ Helpers ============
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ============ Service Worker for PWA-like offline ============
// Not strictly needed since it's a local file, but could be added

// ============ Start ============
init();
</script>
